<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice Matching</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- slim icon rail -->
      <nav class="rail" aria-label="Main">
        <span class="rail-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" /></svg>
        </span>
        <a class="rail-item active" href="#" aria-current="page" title="Invoices">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z" /><path d="M14 3v5h5M10 13h6M10 17h6" /></svg>
          <span class="sr-only">Invoices</span>
        </a>
      </nav>

      <!-- list -->
      <main class="main" id="main">
        <p class="eyebrow" id="eyebrow"></p>
        <div class="title-row">
          <h1>Invoices</h1>
          <div class="tools">
            <div class="search" id="search-box" hidden>
              <input id="search" type="search" placeholder="Supplier, invoice, PO…" aria-label="Search invoices" />
            </div>
            <button class="icon-btn" id="search-toggle" type="button" title="Search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="m20 20-4.2-4.2" /></svg>
              <span class="sr-only">Search</span>
            </button>
            <button class="icon-btn" id="run-samples" type="button" title="Run the 7 sample invoices">
              <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z" /><path d="M14 3v5h5M12 11v6M9 14h6" /></svg>
              <span class="sr-only">Run the 7 sample invoices</span>
            </button>
            <button class="icon-btn" id="recheck" type="button" title="Re-check all (reload suppliers and POs from data/, no AI)">
              <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg>
              <span class="sr-only">Re-check all</span>
            </button>
            <button class="icon-btn primary" id="upload" type="button" title="Upload invoices">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
              <span class="sr-only">Upload invoices</span>
            </button>
            <input id="file-input" type="file" multiple hidden accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.heic,.heif,.svg,.xlsx,.csv,.txt,.xml" />
          </div>
        </div>

        <div class="subbar">
          <label class="ai" for="provider">
            <span class="muted">Read with</span>
            <select id="provider"></select>
            <span id="provider-dot" class="dot" aria-hidden="true"></span>
            <span id="provider-hint" class="muted small"></span>
          </label>
          <div id="summary" class="summary" aria-label="Summary"></div>
        </div>

        <p id="message" class="message" role="alert" hidden></p>

        <div class="table" role="table" aria-label="Invoices">
          <div class="thead" role="row">
            <span role="columnheader">Supplier</span>
            <span role="columnheader">Invoice</span>
            <span role="columnheader" class="hide-sm">PO</span>
            <span role="columnheader" class="num">Total</span>
            <span role="columnheader">Result</span>
          </div>
          <div id="rows" class="rows"></div>
          <div id="empty" class="empty">
            <strong>No invoices yet</strong>
            <span>Drop supplier invoices anywhere here, press <b>+</b> to upload, or run the 7 samples.</span>
          </div>
        </div>
        <div class="drop-overlay" id="drop-overlay" hidden><span>Drop invoices to match them</span></div>
        <button id="clear" class="link-btn" type="button">Clear list</button>
      </main>

      <!-- detail -->
      <aside class="panel" id="panel" aria-label="Invoice details">
        <div class="panel-empty" id="panel-empty">Select an invoice to see how it matched.</div>
        <div id="detail" hidden></div>
      </aside>
    </div>

    <!-- original file viewer -->
    <div class="modal" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Original file">
      <div class="modal-box">
        <div class="modal-head">
          <strong id="viewer-title"></strong>
          <div>
            <a id="viewer-open" target="_blank" rel="noopener" class="link-btn">Open in new tab</a>
            <button class="icon-btn" id="viewer-close" type="button" title="Close">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
              <span class="sr-only">Close</span>
            </button>
          </div>
        </div>
        <div class="modal-body" id="viewer-body"></div>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
